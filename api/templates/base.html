<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CV Matcher{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">CV</span>
      <span class="brand-name">Matcher</span>
    </a>
    <nav>
      {% block nav %}
      {% if request.session.get('candidate_email') %}
        <a href="/auth/logout">Déconnexion</a>
      {% else %}
        <a href="/auth/google?next=/upload" class="nav-cta">Déposer mon CV</a>
      {% endif %}
      {% endblock %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Linkrs Morocco — mise en relation des talents marocains et des postes néerlandophones</p>
    <p class="footer-quiet"><a href="/login">Accès recruteur</a></p>
  </footer>
</body>
</html>
